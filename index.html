<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agenda de Compromissos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Minha Agenda</h1>
  
  <form id="form-compromisso">
    <input type="text" id="titulo" placeholder="Título" required>
    <input type="date" id="data" required>
    <input type="time" id="hora" required>
    <input type="text" id="local" placeholder="Local" required>
    <!-- Botão com id para casar com o JS -->
    <button type="button" id="addBtn">Adicionar</button>
  </form>

  <ul id="lista-compromissos"></ul>

  <script type="module" src="script.js"></script>
</body>
</html>
